<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yorman Carrascal Rojas — Senior Software Engineer & Tech Lead (.NET, Angular, Azure)</title>
  <meta name="author" content="Yorman Carrascal Rojas"/>
  <meta name="description" content="Senior Software Engineer & Tech Lead con 10+ años de experiencia. .NET, Angular, Azure, Docker, Kubernetes, Datadog, AI-Driven Development, GitHub Copilot, MCP. Colombia."/>
  <meta name="keywords" content="Software Engineer, Tech Lead, .NET, C#, Angular, TypeScript, Azure, Docker, Kubernetes, Datadog, CI/CD, Azure DevOps, GitHub Actions, xUnit, Jasmine, JMeter, TDD, BDD, LLMs, GitHub Copilot, MCP, Colombia"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css"/>
</head>
<body>
  <div id="app" v-cloak>
    <div v-if="loadError" class="mx-auto mt-16 max-w-xl rounded-lg border border-red-200 bg-red-50 p-6 text-center text-sm text-red-700">
      No se pudo cargar <b>data/content.json</b>. Abre con un servidor local (ej: Live Server en VS Code).
    </div>

    <template v-else-if="c">
      <!-- Barra de acciones -->
      <div class="print-bar no-print">
        <button type="button" class="secondary" :disabled="generatingPng" @click="downloadPng">
          {{ generatingPng ? c.ui.generatingPng : c.ui.downloadPng }}
        </button>
        <button type="button" :disabled="generatingPdf" @click="downloadPdf">
          {{ generatingPdf ? c.ui.generatingPdf : c.ui.downloadPdf }}
        </button>
      </div>

      <!-- Hoja CV -->
      <div class="sheet" ref="sheet">

        <!-- Header -->
        <header>
          <div class="header-left">
            <h1 class="name">{{ c.header.name }}</h1>
            <div class="role">{{ c.header.role }}</div>
            <div class="tagline" v-if="c.header.tagline">{{ c.header.tagline }}</div>
          </div>
          <div class="contact">
            <div><b>{{ c.header.contact.telLabel }}</b><a :href="c.header.contact.whatsapp" target="_blank" rel="noopener">{{ c.header.contact.phone }}</a></div>
            <div><a :href="'mailto:' + c.header.contact.email">{{ c.header.contact.email }}</a></div>
            <div><a :href="c.header.contact.linkedinUrl" target="_blank" rel="noopener">{{ c.header.contact.linkedin }}</a></div>
            <div><a :href="c.header.contact.githubUrl" target="_blank" rel="noopener">{{ c.header.contact.github }}</a></div>
            <div>{{ c.header.contact.country }}</div>
          </div>
        </header>

        <!-- Perfil -->
        <section>
          <h2 class="section-title">{{ c.sections.profile }}</h2>
          <p class="summary" v-html="c.profile"></p>
        </section>

        <!-- Experiencia principal -->
        <section>
          <h2 class="section-title">{{ c.sections.experience }}</h2>
          <div class="company">
            <span class="company-name">{{ c.experience.company }} <span class="company-former">{{ c.experience.former }}</span></span>
            <span class="company-meta">{{ c.experience.location }}</span>
          </div>
          <div class="exp-item" v-for="(role, i) in c.experience.roles" :key="i">
            <div class="exp-head">
              <h3 class="exp-role">{{ role.title }}</h3>
              <span class="exp-date">{{ role.date }}</span>
            </div>
            <ul class="bullets">
              <li v-for="(b, j) in role.bullets" :key="j">{{ b }}</li>
            </ul>
          </div>

          <!-- Experiencia previa (compacta) -->
          <div class="prev-exp">
            <div class="prev-item" v-for="(p, i) in c.previousExperience" :key="i">
              <div class="company">
                <span class="company-name">{{ p.company }}</span>
                <span class="company-meta">{{ p.location }}</span>
              </div>
              <div class="exp-item">
                <div class="exp-head">
                  <span class="exp-role">{{ p.role }}</span>
                  <span class="exp-date">{{ p.date }}</span>
                </div>
                <ul class="bullets">
                  <li v-for="(b, j) in p.bullets" :key="j">{{ b }}</li>
                </ul>
              </div>
            </div>
          </div>
        </section>

        <!-- Stack -->
        <section>
          <h2 class="section-title">{{ c.sections.skills }}</h2>
          <div class="skills-grid">
            <template v-for="(s, i) in c.skills" :key="i">
              <span class="skill-cat">{{ s.cat }}</span>
              <span class="skill-val">{{ s.val }}</span>
            </template>
          </div>
        </section>

        <!-- Educación -->
        <section>
          <h2 class="section-title">{{ c.sections.education }}</h2>
          <div class="edu-item" v-for="(e, i) in c.education" :key="i">
            <div class="edu-title">{{ e.title }}</div>
            <div class="edu-meta">{{ e.meta }}</div>
          </div>
        </section>

        <!-- Certificaciones -->
        <section>
          <h2 class="section-title">{{ c.sections.courses }}</h2>
          <div class="edu-item" v-for="(course, i) in c.courses" :key="i">
            <div class="edu-title">
              <a :href="course.url" target="_blank" rel="noopener">{{ course.title }}</a>
            </div>
            <div class="edu-meta">{{ course.meta }}</div>
          </div>
        </section>

        <!-- Idiomas -->
        <section>
          <h2 class="section-title">{{ c.sections.languages }}</h2>
          <div class="inline-row" v-for="(l, i) in c.languages" :key="i">
            <span class="k">{{ l.k }}</span>
            <span class="v">{{ l.v }}</span>
          </div>
        </section>

      </div>
    </template>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    const { createApp, ref, onMounted } = Vue;
    createApp({
      setup() {
        const c = ref(null);
        const loadError = ref(false);
        const generatingPdf = ref(false);
        const generatingPng = ref(false);
        const sheet = ref(null);

        onMounted(async () => {
          try {
            const res = await fetch('./data/content.json');
            if (!res.ok) throw new Error('fetch failed');
            c.value = await res.json();
          } catch {
            loadError.value = true;
          }
        });

        async function downloadPdf() {
          generatingPdf.value = true;
          await Vue.nextTick();
          const el = sheet.value.cloneNode(true);
          el.style.margin = '0';
          el.style.boxShadow = 'none';
          document.body.appendChild(el);
          const opt = {
            margin: 0,
            filename: 'yorman-carrascal-cv.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: 'legacy' }
          };
          await html2pdf().set(opt).from(el).save();
          document.body.removeChild(el);
          generatingPdf.value = false;
        }

        async function downloadPng() {
          generatingPng.value = true;
          await Vue.nextTick();
          const canvas = await html2canvas(sheet.value, { scale: 2, useCORS: true });
          const link = document.createElement('a');
          link.download = 'yorman-carrascal-cv.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          generatingPng.value = false;
        }

        return { c, loadError, generatingPdf, generatingPng, sheet, downloadPdf, downloadPng };
      }
    }).mount('#app');
  </script>
</body>
</html>
